<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vulnscan dashboard</title>
<style>
/* Visual language follows the Claude app: warm ivory / charcoal surfaces, a terracotta
   accent, serif display type, quiet borders and generous radii. No external assets. */
:root {
  --bg: #faf9f5;
  --sidebar: #f5f4ed;
  --surface: #ffffff;
  --surface-2: #f0eee6;
  --border: rgba(31, 30, 29, 0.12);
  --border-strong: rgba(31, 30, 29, 0.22);
  --text: #141413;
  --text-2: #3d3d3a;
  --muted: #73726c;
  --accent: #c96442;
  --accent-soft: rgba(201, 100, 66, 0.12);
  --ok: #4a7c59;
  --ok-soft: rgba(74, 124, 89, 0.13);
  --warn: #b7791f;
  --warn-soft: rgba(183, 121, 31, 0.13);
  --bad: #b5402f;
  --bad-soft: rgba(181, 64, 47, 0.12);
  --code-bg: #f5f4ed;
  --sev-critical: #9e2a1e;
  --sev-high: #c96442;
  --sev-medium: #b7791f;
  --sev-low: #5b7a8c;
  --sev-info: #73726c;
  --serif: "Tiempos Text", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --sidebar: #1f1e1d; --surface: #30302e; --surface-2: #3a3936;
    --border: rgba(222, 220, 209, 0.12); --border-strong: rgba(222, 220, 209, 0.24);
    --text: #faf9f5; --text-2: #dedcd1; --muted: #a6a39a;
    --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.16);
    --ok: #7fb08c; --ok-soft: rgba(127, 176, 140, 0.15);
    --warn: #e0a84e; --warn-soft: rgba(224, 168, 78, 0.15);
    --bad: #e07a68; --bad-soft: rgba(224, 122, 104, 0.15);
    --code-bg: #1f1e1d;
    --sev-critical: #f08a78; --sev-high: #d97757; --sev-medium: #e0a84e; --sev-low: #8fb3c7; --sev-info: #a6a39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #262624; --sidebar: #1f1e1d; --surface: #30302e; --surface-2: #3a3936;
  --border: rgba(222, 220, 209, 0.12); --border-strong: rgba(222, 220, 209, 0.24);
  --text: #faf9f5; --text-2: #dedcd1; --muted: #a6a39a;
  --accent: #d97757; --accent-soft: rgba(217, 119, 87, 0.16);
  --ok: #7fb08c; --ok-soft: rgba(127, 176, 140, 0.15);
  --warn: #e0a84e; --warn-soft: rgba(224, 168, 78, 0.15);
  --bad: #e07a68; --bad-soft: rgba(224, 122, 104, 0.15);
  --code-bg: #1f1e1d;
  --sev-critical: #f08a78; --sev-high: #d97757; --sev-medium: #e0a84e; --sev-low: #8fb3c7; --sev-info: #a6a39a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }

/* Sidebar */
.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-family: var(--serif); font-size: 20px; letter-spacing: -0.01em; }
.brand .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); transform: rotate(45deg); }
.side-label { font-size: 12px; color: var(--muted); padding: 8px 10px 6px; font-weight: 500; }
.run-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 9px 10px; cursor: pointer; margin-bottom: 2px; }
.run-item:hover { background: var(--surface-2); }
.run-item.active { background: var(--surface); box-shadow: 0 0 0 1px var(--border); }
.run-item .t { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run-item .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.side-empty { color: var(--muted); font-size: 13px; padding: 10px; }

/* Main */
main { padding: 32px clamp(16px, 4vw, 48px) 64px; max-width: 1180px; width: 100%; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 30px; letter-spacing: -0.015em; margin: 0 0 4px; }
h2 { font-family: var(--serif); font-weight: 400; font-size: 21px; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta code { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); }
.icon-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 13px; color: var(--text-2); }
.icon-btn:hover { border-color: var(--border-strong); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; margin-top: 20px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 13px; }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--text-2); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.pill.run { background: var(--accent-soft); color: var(--accent); }
.pill.run::before { animation: pulse 1.4s ease-in-out infinite; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.idle { color: var(--muted); }
@keyframes pulse { 50% { opacity: .25; } }

/* Progress */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 16px; }
.step { font-size: 12.5px; color: var(--muted); }
.step .bar { height: 4px; border-radius: 4px; background: var(--surface-2); margin-bottom: 7px; overflow: hidden; }
.step .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .5s ease; }
.step.done { color: var(--text-2); }
.step.now { color: var(--accent); font-weight: 500; }
.message { margin-top: 12px; color: var(--text-2); font-size: 14px; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.stat .v { font-family: var(--serif); font-size: 28px; line-height: 1.2; margin-top: 4px; }
.stat .v small { font-family: var(--sans); font-size: 13px; color: var(--muted); }
.stat.accent .v { color: var(--accent); }

/* Tables */
.table-wrap { overflow-x: auto; margin: 0 -6px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12.5px; padding: 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.name { font-family: var(--mono); font-size: 12.5px; word-break: break-all; color: var(--text-2); }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.live { color: var(--muted); font-size: 12.5px; max-width: 360px; }
td.live .l { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Findings */
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--text-2); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.finding { border: 1px solid var(--border); border-radius: 14px; margin-top: 10px; background: var(--surface); overflow: hidden; }
.finding summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.finding summary::-webkit-details-marker { display: none; }
.finding summary:hover { background: var(--surface-2); }
.finding[open] summary { border-bottom: 1px solid var(--border); }
.sev { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 6px; padding: 3px 8px; color: #fff; margin-top: 3px; white-space: nowrap; }
.sev.critical { background: var(--sev-critical); } .sev.high { background: var(--sev-high); }
.sev.medium { background: var(--sev-medium); } .sev.low { background: var(--sev-low); } .sev.info { background: var(--sev-info); }
.f-title { font-family: var(--serif); font-size: 17.5px; line-height: 1.35; }
.f-loc { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 3px; word-break: break-all; }
.f-id { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; margin-top: 4px; }
.f-body { padding: 4px 18px 18px; }
.f-body h4 { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--text-2); margin: 18px 0 6px; }
.f-body p { margin: 0 0 8px; color: var(--text-2); white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 4px 12px; font-size: 13.5px; margin-top: 12px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; color: var(--text-2); word-break: break-word; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow: auto; font: 12.5px/1.5 var(--mono); margin: 0; max-height: 420px; color: var(--text-2); }
pre .add { color: var(--ok); } pre .del { color: var(--bad); } pre .hunk { color: var(--accent); }
.evidence { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.ev { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.ev .h { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-weight: 500; }
.ev pre { margin-top: 8px; max-height: 200px; white-space: pre-wrap; word-break: break-all; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 14px; }
.empty .big { font-family: var(--serif); font-size: 19px; color: var(--text-2); margin-bottom: 4px; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.err { color: var(--bad); }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; max-height: 240px; border-right: 0; border-bottom: 1px solid var(--border); }
  main { padding: 20px 16px 48px; }
  h1 { font-size: 25px; }
  .steps { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .step span { display: none; }
  .finding summary { grid-template-columns: auto minmax(0, 1fr); }
  .finding summary .f-id { display: none; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { margin-top: 6px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="dot" aria-hidden="true"></span>vulnscan</div>
    <div class="side-label">Runs</div>
    <nav id="runs" aria-label="Scan runs"><div class="side-empty">Loading…</div></nav>
  </aside>
  <main id="main">
    <div class="empty"><div class="big">No run selected</div>Start a scan with <code>vulnscan scan</code>; it appears here while it runs.</div>
  </main>
</div>
<script>
"use strict";
const PHASES = ["planning", "building", "scanning", "verifying", "reporting"];
const PHASE_LABEL = { planning: "Plan", building: "Build", scanning: "Scan", verifying: "Verify", reporting: "Report" };
const SEVS = ["critical", "high", "medium", "low", "info"];
const REASONS = {
  invalid_candidate: "Invalid agent output", duplicate: "Duplicate", infra_error: "Container error",
  timeout: "Timed out", reproducer_error: "Reproducer failed", not_reproduced: "Not reproduced",
  patch_missing: "No patch", patch_failed_to_apply: "Patch did not apply", patch_did_not_fix: "Patch did not fix",
  patched_run_inconclusive: "Fix unproven", agent_error: "Agent failed"
};
let runs = [], current = null, statusData = null, findings = [], sevFilter = "all", timer = null, openIds = new Set();

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return Math.round(s) + "s ago";
  if (s < 3600) return Math.round(s / 60) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  return new Date(ts * 1000).toLocaleDateString();
}
function dur(a, b) {
  if (!a) return "";
  const s = Math.max(0, (b || Date.now() / 1000) - a);
  return s < 60 ? Math.round(s) + "s" : s < 3600 ? Math.floor(s / 60) + "m " + Math.round(s % 60) + "s" : Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m";
}
function phasePill(phase, dry) {
  if (phase === "done") return h("span", { class: "pill ok" }, dry ? "Dry run" : "Done");
  if (phase === "failed") return h("span", { class: "pill bad" }, "Failed");
  return h("span", { class: "pill run" }, PHASE_LABEL[phase] || phase);
}
function statePill(state) {
  const map = { queued: ["idle", "Queued"], planned: ["idle", "Planned"], running: ["run", "Running"], done: ["ok", "Done"],
    error: ["bad", "Error"], kept: ["ok", "Verified"], dropped: ["warn", "Dropped"] };
  const [cls, label] = map[state] || ["idle", state || "?"];
  return h("span", { class: "pill " + cls }, label);
}
function usd(v) { return v == null ? "—" : "$" + Number(v).toFixed(2); }
function diffPre(text) {
  const pre = h("pre");
  for (const line of (text || "").split("\n")) {
    const cls = line.startsWith("@@") ? "hunk" : (line.startsWith("+") && !line.startsWith("+++")) ? "add" : (line.startsWith("-") && !line.startsWith("---")) ? "del" : null;
    pre.append(cls ? h("span", { class: cls }, line) : document.createTextNode(line), "\n");
  }
  return pre;
}

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(url + " → " + r.status);
  return r.json();
}

function renderRuns() {
  const nav = document.getElementById("runs");
  nav.replaceChildren();
  if (!runs.length) { nav.append(h("div", { class: "side-empty" }, "No runs yet.")); return; }
  for (const r of runs) {
    const c = r.counts || {};
    nav.append(h("button", { class: "run-item" + (r.run_id === current ? " active" : ""), onclick: () => select(r.run_id) },
      h("div", { class: "t" }, phasePill(r.phase, r.dry_run), r.project),
      h("div", { class: "s" }, (r.mode === "full" ? "Full" : "Diff") + " · " + ago(r.started) + (r.phase === "done" && !r.dry_run ? " · " + (c.verified || 0) + " verified" : ""))));
  }
}

function progressPct(st) {
  const comps = st.components || [], ver = st.verification || [];
  const doneC = comps.filter(c => c.state === "done" || c.state === "error").length;
  const doneV = ver.filter(v => v.state === "kept" || v.state === "dropped").length;
  return {
    planning: st.phase === "planning" ? 50 : 100,
    building: st.phase === "planning" ? 0 : st.phase === "building" ? 40 : 100,
    scanning: ["planning", "building"].includes(st.phase) ? 0 : st.phase === "scanning" ? (comps.length ? 100 * doneC / comps.length : 0) : 100,
    verifying: ["planning", "building", "scanning"].includes(st.phase) ? 0 : st.phase === "verifying" ? (ver.length ? 100 * doneV / ver.length : 50) : 100,
    reporting: st.phase === "done" ? 100 : st.phase === "reporting" ? 50 : 0,
  };
}

function renderMain() {
  const main = document.getElementById("main");
  const st = statusData;
  if (!st) return;
  const s = st.summary || {};
  const counts = st.counts || {};
  const comps = st.components || [];
  const running = !["done", "failed"].includes(st.phase);
  const nodes = [];

  // Header
  nodes.push(h("div", { class: "topbar" },
    h("div", null,
      h("h1", null, st.project),
      h("div", { class: "meta" },
        h("span", null, st.mode === "full" ? "Full scan" : "Diff scan since ", st.mode === "full" ? null : h("code", null, st.base || "?")),
        h("span", null, "Run ", h("code", null, st.run_id)),
        h("span", null, "Started " + ago(st.started)),
        h("span", null, "Elapsed " + dur(st.started, st.finished)))),
    h("div", { style: "display:flex;gap:8px;align-items:center" }, phasePill(st.phase, st.dry_run),
      h("a", { class: "icon-btn", href: "/api/runs/" + encodeURIComponent(st.run_id) + "/report", target: "_blank", rel: "noopener", style: "text-decoration:none" }, "report.md"))));

  // Progress
  const pct = progressPct(st);
  const idx = PHASES.indexOf(st.phase);
  nodes.push(h("section", { class: "card", "aria-label": "Progress" },
    h("div", { class: "card-head" }, h("h2", null, "Progress"), h("span", { class: "sub" }, running ? "Updated " + ago(st.updated) : st.finished ? "Finished " + ago(st.finished) : "")),
    h("div", { class: "steps" }, PHASES.map((p, i) => {
      const cls = st.phase === "done" || i < idx ? "done" : i === idx ? "now" : "";
      const bar = h("div", { class: "bar" }, h("i", { style: "width:" + pct[p].toFixed(0) + "%" }));
      return h("div", { class: "step " + cls }, bar, PHASE_LABEL[p], h("span", null, p === "scanning" && comps.length ? " · " + comps.filter(c => c.state === "done" || c.state === "error").length + "/" + comps.length : ""));
    })),
    st.message ? h("div", { class: "message" + (st.phase === "failed" ? " err" : "") }, st.message) : null));

  // Stats
  const verified = s.verified ?? counts.verified ?? 0;
  const tokens = s.tokens && s.tokens.reported ? (s.tokens.input + s.tokens.output).toLocaleString() : (st.cost && st.cost.input_tokens ? (st.cost.input_tokens + st.cost.output_tokens).toLocaleString() : "—");
  nodes.push(h("div", { class: "stats" },
    stat("Components", (s.components_scanned ?? comps.filter(c => c.state === "done").length), "of " + comps.length),
    stat("Candidates", s.candidates ?? counts.candidates ?? 0),
    stat("Verified findings", verified, null, true),
    stat("Dropped", s.dropped ?? counts.dropped ?? 0, "unproven"),
    stat("Tokens", tokens),
    stat("Cost", usd(s.cost_usd ?? (st.cost ? st.cost.usd : null)))));

  // Findings
  nodes.push(renderFindings(st));

  // Components
  nodes.push(h("section", { class: "card", "aria-label": "Components" },
    h("div", { class: "card-head" }, h("h2", null, "Components"), h("span", { class: "sub" }, comps.length + " in this run")),
    comps.length ? h("div", { class: "table-wrap" }, h("table", null,
      h("thead", null, h("tr", null, h("th", null, "Component"), h("th", null, "State"), h("th", null, "Files"), h("th", null, "Candidates"), h("th", null, "Cost"), h("th", null, "Activity"))),
      h("tbody", null, comps.map(c => h("tr", null,
        h("td", { class: "name" }, c.name),
        h("td", null, statePill(c.state)),
        h("td", { class: "num" }, c.file_count ?? ""),
        h("td", { class: "num" }, c.candidates ?? 0),
        h("td", { class: "num" }, usd(c.cost_usd)),
        h("td", { class: "live" }, h("div", { class: "l" + (c.error ? " err" : "") },
          c.error ? c.error : c.progress ? (c.progress.turns || 0) + " turns · " + (c.progress.tool_calls || 0) + " tool calls · " + (c.progress.last || "") : c.state === "running" ? "starting… " + dur(c.started) : c.finished ? "took " + dur(c.started, c.finished) : "")))))))
      : h("div", { class: "empty" }, "No components selected (nothing changed since the base ref?)")));

  // Verification
  const ver = st.verification || [];
  if (ver.length || (s.dropped_by_reason && Object.keys(s.dropped_by_reason).length)) {
    const by = s.dropped_by_reason || counts.by_reason || {};
    nodes.push(h("section", { class: "card", "aria-label": "Verification" },
      h("div", { class: "card-head" }, h("h2", null, "Verification gate"), h("span", { class: "sub" }, "Each reproducer re-run offline, before and after its patch")),
      ver.length ? h("div", { class: "table-wrap" }, h("table", null,
        h("thead", null, h("tr", null, h("th", null, "Candidate"), h("th", null, "Component"), h("th", null, "State"), h("th", null, "Result"))),
        h("tbody", null, ver.map(v => h("tr", null,
          h("td", null, v.title, h("div", { class: "f-loc" }, v.id)),
          h("td", { class: "name" }, v.component),
          h("td", null, statePill(v.state)),
          h("td", { class: "live" }, v.reason ? (v.reason === "verified" ? "verified, patch " + (v.patch_check || "") : (REASONS[v.reason] || v.reason)) : "")))))) : null,
      Object.keys(by).length ? h("div", { class: "reasons" }, Object.entries(by).map(([k, n]) => h("span", { class: "pill warn" }, (REASONS[k] || k) + " · " + n))) : null));
  }

  main.replaceChildren(...nodes);
}

function stat(k, v, small, accent) {
  return h("div", { class: "stat" + (accent ? " accent" : "") }, h("div", { class: "k" }, k), h("div", { class: "v" }, String(v), small ? h("small", null, " " + small) : null));
}

function renderFindings(st) {
  const list = findings.filter(f => sevFilter === "all" || f.severity === sevFilter);
  const counts = Object.fromEntries(SEVS.map(s => [s, findings.filter(f => f.severity === s).length]));
  const head = h("div", { class: "card-head" }, h("h2", null, "Findings"),
    h("div", { class: "filters", role: "group", "aria-label": "Filter by severity" },
      h("button", { class: "chip", "aria-pressed": String(sevFilter === "all"), onclick: () => { sevFilter = "all"; renderMain(); } }, "All " + findings.length),
      SEVS.filter(s => counts[s]).map(s => h("button", { class: "chip", "aria-pressed": String(sevFilter === s), onclick: () => { sevFilter = s; renderMain(); } }, s[0].toUpperCase() + s.slice(1) + " " + counts[s]))));
  let body;
  if (!findings.length) {
    const msg = st.dry_run ? ["Dry run", "No agents ran, so there are no findings."]
      : ["done", "failed"].includes(st.phase) ? ["No verified findings", "Candidates that did not pass the verification gate are counted under Dropped, not listed here."]
      : ["Nothing verified yet", "Findings appear here once their reproducer has passed the gate."];
    body = h("div", { class: "empty" }, h("div", { class: "big" }, msg[0]), msg[1]);
  } else {
    body = h("div", null, list.map(findingCard));
  }
  return h("section", { class: "card", "aria-label": "Findings" }, head, body);
}

function evidenceBox(label, ev) {
  if (!ev) return h("div", { class: "ev" }, h("div", { class: "h" }, label, h("span", { class: "pill idle" }, "not run")));
  const ok = label.startsWith("Unpatched") ? ev.proof_line_seen : !ev.proof_line_seen && ev.exit_code === 0;
  return h("div", { class: "ev" },
    h("div", { class: "h" }, label, h("span", { class: "pill " + (ok ? "ok" : "warn") }, ev.proof_line_seen ? "proof printed" : "no proof")),
    h("div", { class: "sub" }, "exit " + ev.exit_code + " · " + ev.duration_s + " s" + (ev.timed_out ? " · timed out" : "")),
    ev.stdout_tail ? h("pre", null, ev.stdout_tail) : null);
}

function findingCard(f) {
  const v = f.verification || {};
  const d = h("details", { class: "finding", open: openIds.has(f.id) },
    h("summary", null,
      h("span", { class: "sev " + f.severity }, f.severity),
      h("div", null, h("div", { class: "f-title" }, f.title), h("div", { class: "f-loc" }, f.location + " · " + f.component)),
      h("span", { class: "f-id" }, f.id)),
    h("div", { class: "f-body" },
      h("dl", { class: "kv" },
        h("dt", null, "CWE"), h("dd", null, f.cwe || "—"),
        h("dt", null, "Severity rationale"), h("dd", null, f.severity_rationale || "—"),
        h("dt", null, "Verification"), h("dd", null, (v.status || "") + ", patch " + (v.patch_check || "")),
        f.seed_ids && f.seed_ids.length ? [h("dt", null, "Seeds"), h("dd", null, f.seed_ids.join(", "))] : null),
      h("h4", null, "Description"), h("p", null, f.description),
      h("h4", null, "Impact"), h("p", null, f.impact),
      h("h4", null, "Evidence from the scanner's own runs"),
      h("div", { class: "evidence" }, evidenceBox("Unpatched", v.unpatched_run), evidenceBox("Patched", v.patched_run)),
      h("h4", null, "Reproducer"), h("pre", null, (f.reproducer || {}).script || ""),
      ((f.reproducer || {}).files || []).map(rf => [h("h4", null, rf.path), h("pre", null, rf.content)]),
      h("h4", null, "Proposed patch"), f.patch ? diffPre(f.patch) : h("p", null, "—")));
  d.addEventListener("toggle", () => { d.open ? openIds.add(f.id) : openIds.delete(f.id); });
  return d;
}

async function refresh() {
  clearTimeout(timer);
  try {
    runs = await getJSON("/api/runs");
    if (!current && runs.length) current = runs[0].run_id;
    renderRuns();
    if (current) {
      statusData = await getJSON("/api/runs/" + encodeURIComponent(current));
      findings = await getJSON("/api/runs/" + encodeURIComponent(current) + "/findings");
      renderMain();
    }
  } catch (e) {
    console.error(e);
  }
  const live = statusData && !["done", "failed"].includes(statusData.phase);
  timer = setTimeout(refresh, live ? 2000 : 10000);
}
function select(id) {
  current = id; sevFilter = "all"; openIds = new Set();
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  refresh();
}
if (location.hash.length > 1) current = decodeURIComponent(location.hash.slice(1));
refresh();
</script>
</body>
</html>
