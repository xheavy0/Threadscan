<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Threadscan</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* Security-console design system modelled on Wiz's product UI: white icon rail with labels,
   white top bar with a scope selector and search pill, rounded filter pills (blue when
   active), GROUP BY segmented control, round letter severity badges, pill statuses,
   dotted-canvas graph. Type: DM Sans (text) and Poppins (titles), the open fonts Wiz uses,
   plus JetBrains Mono; icons: Lucide (ISC). All self-hosted; nothing loads from another host. */
@font-face { font-family: "DM Sans"; src: url(/static/fonts/dm-sans.woff2) format("woff2"); font-weight: 100 1000; font-display: swap; }
@font-face { font-family: "Poppins"; src: url(/static/fonts/poppins-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Poppins"; src: url(/static/fonts/poppins-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Poppins"; src: url(/static/fonts/poppins-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/static/fonts/jetbrains-mono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/static/fonts/jetbrains-mono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }

:root {
  --sans: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --head: "Poppins", "DM Sans", "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --bg: #ffffff; --bg-2: #f7f8fa; --bg-3: #f1f3f6; --card: #ffffff;
  --line: #e4e7ec; --line-2: #d0d5dd;
  --text: #1d2433; --text-2: #3b4458; --muted: #6b7385;
  --primary: #1b5cff; --primary-2: #0f47d6; --primary-soft: #eaf0ff;
  --c-fg: #d1242f; --c-bg: #ffe4e6; --c-bar: #e5484d;
  --h-fg: #c2410c; --h-bg: #ffedd5; --h-bar: #f76b15;
  --m-fg: #a16207; --m-bg: #fef3c7; --m-bar: #f5b301;
  --l-fg: #475467; --l-bg: #eef1f5; --l-bar: #98a2b3;
  --i-fg: #475467; --i-bg: #f2f4f7; --i-bar: #c0c7d2;
  --ok-fg: #12804a; --ok-bg: #e6f6ec; --warn-fg: #a15c00; --warn-bg: #fff4e0; --bad-fg: #c4232f; --bad-bg: #fde8ea;
  --node-comp: #2a3550; --node-file: #8b95a7; --node-owasp: #7c5cff; --node-fix: #12a36b;
  --shadow-lg: 0 20px 48px rgba(16, 24, 40, .18);
  color-scheme: light;
}
:root.dark {
  --bg: #0f1424; --bg-2: #141a2c; --bg-3: #1a2135; --card: #151b2d;
  --line: #262e45; --line-2: #333d58;
  --text: #e7eaf2; --text-2: #c3c9d8; --muted: #98a1b5;
  --primary: #5b8bff; --primary-2: #7aa2ff; --primary-soft: #1c2850;
  --c-fg: #ff8a8f; --c-bg: #3b1820; --h-fg: #ffa36b; --h-bg: #3a2216; --m-fg: #f5c84b; --m-bg: #352c10;
  --l-fg: #b6bfcf; --l-bg: #242c40; --i-fg: #b6bfcf; --i-bg: #20283b;
  --ok-fg: #4fd08f; --ok-bg: #12301f; --warn-fg: #ffbb55; --warn-bg: #36280e; --bad-fg: #ff7f88; --bad-bg: #3a1820;
  --node-comp: #c9d2e6; --node-file: #6d7891;
  --shadow-lg: 0 20px 48px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, a, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 8px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
code, pre { font-family: var(--mono); }
h1, h2, h3, h4, p { margin: 0; }
svg.i { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }

/* ---------- rail ---------- */
.shell { display: flex; min-height: 100vh; }
.rail { width: 88px; flex: 0 0 88px; background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 20; }
.rail .logo { display: block; margin-bottom: 16px; }
.rail .logo img { width: 34px; height: 34px; display: block; }
.rail-item { width: 78px; flex-direction: column; gap: 5px; padding: 8px 0; border-radius: 10px; color: var(--text-2); font-size: 12px; font-weight: 500; text-align: center; line-height: 1.15; }
.rail-item .ico { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.rail-item .ico svg { width: 22px; height: 22px; stroke-width: 1.6; }
.rail-item:hover .ico { background: var(--bg-3); }
.rail-item.active { color: var(--primary); font-weight: 600; }
.rail-item.active .ico { background: var(--primary); color: #fff; }
.rail-spacer { flex: 1; }
.rail-foot { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
.rail-foot .loc { display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; padding: 6px 0; }
.rail-foot .loc svg { color: var(--ok-fg); }

/* ---------- top bar ---------- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 60px; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: var(--bg); position: sticky; top: 0; z-index: 15; border-bottom: 1px solid var(--line); }
.scope { height: 36px; padding: 0 10px; border-radius: 8px; font-size: 14.5px; font-weight: 500; color: var(--text); }
.scope:hover { background: var(--bg-3); }
.scope .sub { color: var(--muted); font-weight: 400; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.search-pill { position: relative; }
.search-pill input { height: 38px; width: 280px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); padding: 0 56px 0 38px; font-size: 14px; color: var(--text); }
.search-pill input::placeholder { color: var(--muted); }
.search-pill input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.search-pill > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search-pill kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 11px var(--sans); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.icon-btn { width: 38px; height: 38px; border-radius: 8px; justify-content: center; color: var(--text-2); border: 1px solid transparent; }
.icon-btn:hover { background: var(--bg-3); color: var(--text); }
.icon-btn.boxed { border-color: var(--line-2); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #d8f3e4; color: #12804a; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }

/* ---------- page ---------- */
.content { padding: 22px 28px 64px; width: 100%; max-width: 1480px; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.page-head h1 { font: 500 28px/1.25 var(--head); letter-spacing: -.01em; color: var(--text); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.page-sub { color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; }
.page-sub code { font-size: 12.5px; color: var(--text-2); }

/* ---------- filters ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.filters .search-pill input { width: 260px; padding-right: 14px; }
.fpill { height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-size: 14px; color: var(--text-2); }
.fpill:hover { border-color: var(--muted); }
.fpill.on { border-color: var(--primary); color: var(--primary); }
.fpill b { font-weight: 600; }
.qchip { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); font-size: 13.5px; color: var(--text-2); }
.qchip[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
.link-btn { color: var(--primary); font-size: 14px; padding: 0 6px; height: 38px; }
.results-count { margin-left: auto; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.menu { position: absolute; z-index: 60; min-width: 230px; max-height: 340px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; }
.menu .opt { width: 100%; padding: 8px 10px; border-radius: 7px; font-size: 14px; color: var(--text-2); justify-content: flex-start; text-align: left; }
.menu .opt:hover { background: var(--bg-3); color: var(--text); }
.menu .opt .box { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-2); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.menu .opt.sel .box { background: var(--primary); border-color: var(--primary); color: #fff; }
.menu .opt.sel .box svg { width: 12px; height: 12px; stroke-width: 3; }
.menu .opt.sel:not(.multi) { color: var(--primary); font-weight: 500; }
.menu .opt .cnt { margin-left: auto; color: var(--muted); font-size: 12.5px; }
.menu .head { font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 6px 10px 4px; text-transform: uppercase; letter-spacing: .05em; }

.groupby { display: inline-flex; align-items: stretch; margin-top: 14px; }
.groupby .lbl { background: var(--bg-3); color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .06em; padding: 0 12px; display: flex; align-items: center; border-radius: 8px 0 0 8px; }
.groupby button { height: 36px; padding: 0 14px; border: 1px solid var(--line-2); margin-left: -1px; font-size: 14px; color: var(--text-2); background: var(--card); }
.groupby button:last-child { border-radius: 0 8px 8px 0; }
.groupby button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary); position: relative; z-index: 1; }

/* ---------- badges / pills ---------- */
.sevc { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.sevc.critical { background: var(--c-bg); color: var(--c-fg); } .sevc.high { background: var(--h-bg); color: var(--h-fg); }
.sevc.medium { background: var(--m-bg); color: var(--m-fg); } .sevc.low { background: var(--l-bg); color: var(--l-fg); } .sevc.info { background: var(--i-bg); color: var(--i-fg); }
.sev { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 14px; color: var(--text-2); }
.counts { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.counts span { display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px; }
.status { display: inline-flex; align-items: center; height: 26px; padding: 0 11px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; background: var(--bg-3); color: var(--text-2); }
.status.ok { background: var(--ok-bg); color: var(--ok-fg); } .status.warn { background: var(--warn-bg); color: var(--warn-fg); }
.status.bad { background: var(--bad-bg); color: var(--bad-fg); } .status.blue { background: var(--primary-soft); color: var(--primary); }
.status.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 7px; animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--bg-3); color: var(--text-2); white-space: nowrap; }
.tag.new { background: var(--primary-soft); color: var(--primary); }
.tag.re { background: var(--warn-bg); color: var(--warn-fg); }
.delta { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
.delta.up { background: var(--bad-bg); color: var(--bad-fg); } .delta.down { background: var(--ok-bg); color: var(--ok-fg); } .delta.flat { background: var(--bg-3); color: var(--muted); }

/* ---------- cards ---------- */
.widgets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 18px; }
.widgets.two { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
.card-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 18px 4px; }
.card-h h3 { font: 500 17px/1.3 var(--head); color: var(--text); }
.card-h .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.card-b { padding: 10px 18px 18px; }
.sevlist { display: flex; flex-direction: column; gap: 12px; }
.sevlist .row { display: flex; align-items: center; gap: 12px; cursor: pointer; border-radius: 8px; }
.sevlist .row:hover .n { color: var(--primary); }
.sevlist .n { font: 500 20px/1.1 var(--head); color: var(--text); }
.sevlist .l { font-size: 13px; color: var(--muted); }
.big { font: 500 34px/1.1 var(--head); color: var(--text); letter-spacing: -.01em; }
.kv-mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.kv-mini div { background: var(--bg-2); border-radius: 8px; padding: 10px 12px; }
.kv-mini b { display: block; font: 500 22px var(--head); color: var(--text); }
.kv-mini span { font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--bg-3); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bars .row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 36px; gap: 12px; align-items: center; font-size: 13.5px; color: var(--text-2); }
.bars .num { text-align: right; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.step { display: flex; gap: 10px; align-items: center; padding: 14px 16px; border-right: 1px solid var(--line); min-width: 0; }
.step:last-child { border-right: 0; }
.step .n { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line-2); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); flex-shrink: 0; }
.step .n svg { width: 15px; height: 15px; stroke-width: 2.6; }
.step.done .n { background: var(--ok-fg); border-color: var(--ok-fg); color: #fff; }
.step.now .n { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.step .t { font-weight: 600; font-size: 14px; color: var(--text); }
.step .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { margin-top: 16px; padding: 12px 16px; border-radius: 10px; display: flex; gap: 10px; align-items: flex-start; font-size: 14px; background: var(--primary-soft); color: var(--text-2); }
.banner.warn { background: var(--warn-bg); color: var(--text); } .banner.warn > svg { color: var(--warn-fg); }
.banner.bad { background: var(--bad-bg); color: var(--text); }
.banner code { font-size: 12.5px; word-break: break-all; }
.chart { width: 100%; height: 150px; display: block; }
.chart text { font: 11.5px var(--sans); fill: var(--muted); }

/* ---------- tables ---------- */
.table-card { margin-top: 14px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 13.5px; }
td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; color: var(--text-2); }
tbody tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 16px; } th:last-child, td:last-child { padding-right: 16px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--bg-2); }
tr.sel td { background: var(--primary-soft) !important; }
tr.group td { background: var(--bg-2); font-weight: 600; color: var(--text); cursor: pointer; }
tr.group td .chev { transition: transform .15s; display: inline-flex; vertical-align: middle; margin-right: 6px; color: var(--muted); }
tr.group.open td .chev { transform: rotate(90deg); }
.t-title { font-weight: 500; color: var(--text); }
.t-sub { font: 12px var(--mono); color: var(--muted); margin-top: 2px; }
.mono { font: 12.5px var(--mono); color: var(--text-2); overflow-wrap: anywhere; }
td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.act { color: var(--muted); font-size: 13px; max-width: 380px; }
td.act .l { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.err { color: var(--bad-fg) !important; }
.muted { color: var(--muted); }
.empty { text-align: center; padding: 48px 16px; color: var(--muted); }
.empty .ttl { font: 500 17px var(--head); color: var(--text); margin-bottom: 4px; }
.empty .ic { width: 48px; height: 48px; border-radius: 14px; background: var(--ok-bg); color: var(--ok-fg); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
.empty .ic svg { width: 24px; height: 24px; }

/* ---------- graph ---------- */
.canvas { position: relative; background-color: var(--bg-2); background-image: radial-gradient(var(--line-2) 1px, transparent 1px); background-size: 18px 18px; border-radius: 12px; border: 1px solid var(--line); overflow: auto; }
.canvas svg.g { display: block; margin: 0 auto; }
.canvas .edge { fill: none; stroke: var(--line-2); stroke-width: 1.6; }
.canvas .node circle.bgc { stroke: var(--card); stroke-width: 3; }
.canvas .node text { font: 12.5px var(--sans); fill: var(--text-2); paint-order: stroke; stroke: var(--bg-2); stroke-width: 4px; stroke-linejoin: round; }
.canvas .node text.k { font-size: 11px; fill: var(--muted); }
.canvas .node.click { cursor: pointer; }
.canvas .node.click:hover circle.bgc { stroke: var(--primary); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 14px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); background: var(--card); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

/* ---------- compliance ---------- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-top: 16px; }
.ccard { text-align: left; align-items: stretch; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); min-height: 132px; }
.ccard:hover { border-color: var(--primary); }
.ccard .code { font: 600 12.5px var(--mono); color: var(--primary); }
.ccard .name { font: 500 15.5px/1.35 var(--head); color: var(--text); }
.ccard .foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; gap: 8px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(16, 24, 40, .32); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(840px, 100vw); background: var(--card); z-index: 50; box-shadow: var(--shadow-lg); transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.d-head { padding: 18px 24px 0; border-bottom: 1px solid var(--line); }
.d-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.d-head h2 { font: 500 21px/1.35 var(--head); margin: 10px 0 8px; color: var(--text); }
.d-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--muted); }
.d-ctrl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
.select, .input, .textarea { height: 36px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--card); padding: 0 10px; font-size: 14px; color: var(--text); }
.textarea { height: auto; min-height: 96px; width: 100%; padding: 10px; resize: vertical; }
.select:focus, .input:focus, .textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.btn-primary { height: 36px; padding: 0 16px; border-radius: 8px; background: var(--primary); color: #fff; font-size: 14px; font-weight: 500; }
.btn-primary:hover { background: var(--primary-2); }
.d-tabs { display: flex; gap: 22px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
.d-tabs::-webkit-scrollbar { display: none; }
.d-tabs button { padding: 8px 0 10px; font-size: 14.5px; color: var(--text-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.d-tabs button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.d-body { padding: 20px 24px 48px; overflow-y: auto; flex: 1; }
.d-body h4 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
.d-body > h4:first-child { margin-top: 0; }
.d-body p { color: var(--text-2); white-space: pre-wrap; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 0; }
.facts div { padding: 11px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.facts div:nth-child(odd) { border-right: 1px solid var(--line); }
.facts div:nth-last-child(-n+2) { border-bottom: 0; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 3px 0 0; color: var(--text); word-break: break-word; }
pre { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow: auto; font: 12.5px/1.6 var(--mono); margin: 0; max-height: 460px; color: var(--text-2); }
pre .add { color: var(--ok-fg); } pre .del { color: var(--bad-fg); } pre .hunk { color: var(--primary); } pre .dmeta { color: var(--muted); }
.file-label { font: 12px var(--mono); color: var(--muted); margin: 14px 0 6px; }
.ev-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.ev { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.ev .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 600; color: var(--text); }
.ev .s { font: 12px var(--mono); color: var(--muted); margin-top: 4px; }
.ev pre { margin-top: 10px; max-height: 220px; white-space: pre-wrap; word-break: break-all; }
.callout { border-left: 3px solid var(--primary); background: var(--primary-soft); padding: 10px 14px; border-radius: 0 10px 10px 0; color: var(--text-2); font-size: 13.5px; }
.timeline { display: flex; flex-direction: column; gap: 12px; }
.timeline .ev-row { display: flex; gap: 10px; font-size: 13.5px; color: var(--text-2); }
.timeline .ev-row svg { color: var(--muted); margin-top: 2px; }
.timeline time { color: var(--muted); font-size: 12.5px; display: block; }
.saved { color: var(--ok-fg); font-size: 13px; }

.welcome { max-width: 560px; margin: 12vh auto 0; text-align: center; }
.welcome img { width: 64px; height: 64px; }
.welcome h1 { font: 500 26px var(--head); margin: 16px 0 6px; }
.welcome p { color: var(--muted); }
.welcome pre { text-align: left; margin-top: 18px; }

@media (max-width: 1180px) { .widgets { grid-template-columns: repeat(2, minmax(0, 1fr)); } .widgets.two { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  .shell { flex-direction: column; }
  .rail { width: 100%; flex: none; height: auto; position: static; flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .rail .logo { margin: 0 8px 0 4px; flex-shrink: 0; }
  .rail-item { width: 70px; flex-shrink: 0; }
  .rail-spacer, .rail-foot .loc { display: none; }
  .rail-foot { flex-direction: row; }
  .topbar { position: static; flex-wrap: wrap; height: auto; padding: 10px 16px; }
  .top-right { width: 100%; }
  .top-right .search-pill { flex: 1; } .top-right .search-pill input { width: 100%; }
  .content { padding: 18px 16px 48px; }
  .widgets { grid-template-columns: 1fr; }
  .steps { grid-template-columns: 1fr; } .step { border-right: 0; border-bottom: 1px solid var(--line); } .step:last-child { border-bottom: 0; }
  .filters .search-pill, .filters .search-pill input { width: 100%; }
  .groupby { overflow-x: auto; max-width: 100%; }
  .ev-grid, .facts { grid-template-columns: 1fr; } .facts div { border-right: 0 !important; }
  .hide-sm { display: none !important; }
  .d-head, .d-body { padding-left: 16px; padding-right: 16px; }
}

function icon(name, cls) {

/* ---------- render ---------- */
