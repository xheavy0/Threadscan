<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1533">
<title>Threadscan</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
/* Cloud-security-console layout: navy side navigation, light work area, an issues table
   with severity chips and filter pills, and a detail drawer from the right.
   Fonts are self-hosted Latin subsets (SIL OFL); nothing is fetched from another host. */
@font-face { font-family: "Inter Variable"; src: url(/static/fonts/inter.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/static/fonts/jetbrains-mono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "JetBrains Mono"; src: url(/static/fonts/jetbrains-mono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }

:root {
  --sans: "Inter Variable", Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  --bg: #f4f6fb; --card: #ffffff; --card-2: #f8f9fc; --line: #e3e7f0; --line-2: #cfd6e4;
  --text: #0f1a33; --text-2: #34405c; --muted: #66728e;
  --primary: #1f5eff; --primary-2: #164ad6; --primary-soft: #e8eeff;
  --nav: #0b1533; --nav-2: #121e44; --nav-active: #1b2a5c; --nav-text: #c3cbe2; --nav-muted: #7f8bad; --nav-line: #ffffff12;
  --crit: #b4123a; --high: #e0452a; --med: #e88400; --low: #b98f00; --info: #5b6b8c; --info-bg: #eef1f7;
  --ok: #138a5c; --ok-bg: #e3f6ee; --warn: #b26b00; --warn-bg: #fff1dc; --bad: #c42b3c; --bad-bg: #fde9eb;
  --shadow: 0 1px 2px rgba(15, 26, 51, .06), 0 1px 1px rgba(15, 26, 51, .03);
  --shadow-lg: 0 24px 64px rgba(15, 26, 51, .22);
  color-scheme: light;
}
:root.dark {
  --bg: #0a1226; --card: #111b34; --card-2: #0e1730; --line: #213056; --line-2: #2e3f6b;
  --text: #e8edf9; --text-2: #c2cbe2; --muted: #8d99b9;
  --primary: #5b8cff; --primary-2: #7aa2ff; --primary-soft: #1a2a55;
  --nav: #070e22; --nav-2: #0d1734; --nav-active: #18264f;
  --crit: #ff5d7d; --high: #ff7a5c; --med: #ffad42; --low: #f1cf4a; --info: #9aa8c8; --info-bg: #1c2747;
  --ok: #3ccf8e; --ok-bg: #0f3226; --warn: #ffb44d; --warn-bg: #36260b; --bad: #ff6b7a; --bad-bg: #3a151c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 24px 64px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11"; }
button, a, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; display: inline-flex; align-items: center; gap: 8px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
code, pre { font-family: var(--mono); }
h1, h2, h3, h4, p { margin: 0; }
svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- shell ---------- */
.shell { display: flex; min-height: 100vh; }
.nav { width: 236px; flex: 0 0 236px; background: var(--nav); color: var(--nav-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px; border-bottom: 1px solid var(--nav-line); }
.brand img { width: 30px; height: 30px; display: block; }
.brand b { display: block; color: #fff; font-size: 16px; font-weight: 650; letter-spacing: -.01em; }
.brand b span { color: #9fd84a; }
.brand small { display: block; color: var(--nav-muted); font-size: 10.5px; margin-top: 1px; }
.nav-group { padding: 14px 10px 4px; }
.nav-label { font-size: 10.5px; font-weight: 600; color: var(--nav-muted); letter-spacing: .06em; text-transform: uppercase; padding: 0 10px 6px; display: flex; justify-content: space-between; }
.nav-item { width: 100%; padding: 8px 10px; border-radius: 7px; font-size: 13px; color: var(--nav-text); position: relative; }
.nav-item:hover { background: var(--nav-2); color: #fff; }
.nav-item.active { background: var(--nav-active); color: #fff; font-weight: 550; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--primary); }
.nav-item .badge { margin-left: auto; font-size: 11px; font-weight: 600; background: #ffffff14; color: #fff; padding: 0 7px; border-radius: 999px; line-height: 18px; }
.nav-item .badge.hot { background: var(--crit); }
.runs { display: flex; flex-direction: column; gap: 1px; }
.run { width: 100%; text-align: left; padding: 7px 10px; border-radius: 7px; align-items: flex-start; color: var(--nav-text); }
.run:hover { background: var(--nav-2); }
.run.active { background: var(--nav-active); color: #fff; }
.run .d { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; background: #5d6a8e; flex-shrink: 0; }
.run .d.live { background: #5b8cff; box-shadow: 0 0 0 3px #1f5eff33; animation: pulse 1.4s infinite; }
.run .d.ok { background: #3ccf8e; } .run .d.bad { background: #ff6b7a; } .run .d.warn { background: #ffad42; }
.run .t { font-size: 12.5px; font-weight: 550; display: block; }
.run small { display: block; font-size: 11px; color: var(--nav-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-foot { margin-top: auto; padding: 12px 14px 14px; border-top: 1px solid var(--nav-line); display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--nav-muted); }
.nav-foot .loc { display: flex; align-items: center; gap: 7px; }
.nav-foot .loc svg { color: #3ccf8e; }
.icon-btn { width: 30px; height: 30px; border-radius: 7px; justify-content: center; color: var(--nav-text); }
.icon-btn:hover { background: var(--nav-2); color: #fff; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { height: 56px; min-height: 56px; background: var(--card); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 0 24px; position: sticky; top: 0; z-index: 10; }
.crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; min-width: 0; white-space: nowrap; }
.crumbs b { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--line-2); }
.search { margin-left: auto; position: relative; width: min(340px, 34vw); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; height: 34px; border: 1px solid var(--line); background: var(--card-2); border-radius: 8px; padding: 0 12px 0 32px; font-size: 12.5px; color: var(--text); }
.search input:focus { outline: none; border-color: var(--primary); background: var(--card); box-shadow: 0 0 0 3px var(--primary-soft); }
.btn { height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; font-weight: 550; color: var(--text-2); text-decoration: none; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--line-2); color: var(--text); }
.link { color: var(--primary); font-size: 12px; font-weight: 550; }

.content { padding: 22px 24px 60px; max-width: 1320px; width: 100%; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 22px; font-weight: 650; letter-spacing: -.015em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.page-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; display: flex; gap: 6px 14px; flex-wrap: wrap; }
.page-head .sub code { font-size: 11.5px; color: var(--text-2); }

/* ---------- status chips ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--info-bg); color: var(--info); }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.live { background: var(--primary-soft); color: var(--primary); } .chip.live::before { animation: pulse 1.4s infinite; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }

/* ---------- severity ---------- */
.sev { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.sev .ic { width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 750; color: #fff; }
.sev.critical { color: var(--crit); } .sev.critical .ic { background: var(--crit); }
.sev.high { color: var(--high); } .sev.high .ic { background: var(--high); }
.sev.medium { color: var(--med); } .sev.medium .ic { background: var(--med); }
.sev.low { color: var(--low); } .sev.low .ic { background: var(--low); }
.sev.info { color: var(--info); } .sev.info .ic { background: var(--info); }

/* ---------- cards / widgets ---------- */
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px 0; }
.card-h h3 { font-size: 13px; font-weight: 650; color: var(--text); }
.card-h .note { font-size: 11.5px; color: var(--muted); }
.card-b { padding: 12px 16px 16px; }
.card > .table-wrap { margin-top: 10px; }
.kpi .label { font-size: 12px; color: var(--muted); font-weight: 550; display: flex; justify-content: space-between; align-items: center; }
.kpi .val { font-size: 30px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 6px; font-variant-numeric: tabular-nums; }
.kpi .val small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.kpi .foot { font-size: 11.5px; color: var(--muted); margin-top: 8px; min-height: 17px; }
.kpi.accent .val { color: var(--primary); }
.sevbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--card-2); margin-top: 10px; gap: 2px; border: 1px solid var(--line); }
.sevbar i { display: block; height: 100%; }
.progress { height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; margin-top: 10px; border: 1px solid var(--line); }
.progress i { display: block; height: 100%; background: var(--primary); transition: width .5s; }
.two { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); margin-top: 14px; align-items: start; }

.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.stage { padding: 12px 14px; display: flex; gap: 10px; align-items: center; border-right: 1px solid var(--line); min-width: 0; }
.stage:last-child { border-right: 0; }
.stage .n { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 700; border: 1.5px solid var(--line-2); color: var(--muted); flex-shrink: 0; background: var(--card); }
.stage .n svg { width: 14px; height: 14px; stroke-width: 2.4; }
.stage.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
.stage.now .n { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.stage.fail .n { background: var(--bad); border-color: var(--bad); color: #fff; }
.stage .t { font-weight: 600; font-size: 12.5px; }
.stage .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { margin-top: 14px; padding: 10px 14px; border-radius: 8px; font-size: 12.5px; display: flex; gap: 10px; align-items: flex-start; background: var(--primary-soft); color: var(--text-2); }
.banner.warn { background: var(--warn-bg); color: var(--text); }
.banner.warn svg { color: var(--warn); margin-top: 1px; }
.banner.bad { background: var(--bad-bg); color: var(--text); }
.banner code { font-size: 11.5px; word-break: break-all; }

.bars { display: flex; flex-direction: column; gap: 9px; }
.bars .row { display: grid; grid-template-columns: 112px minmax(0, 1fr) 34px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--text-2); }
.bars .row.wide { grid-template-columns: minmax(0, 1fr) 34px; }
.track { height: 8px; border-radius: 4px; background: var(--card-2); overflow: hidden; border: 1px solid var(--line); }
.track i { display: block; height: 100%; border-radius: 4px; }
.num { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--text); }

/* ---------- tables ---------- */
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.pill { height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); font-size: 12px; font-weight: 550; color: var(--text-2); display: inline-flex; align-items: center; gap: 8px; }
.pill:hover { border-color: var(--line-2); }
.pill[aria-pressed="true"] { background: var(--primary-soft); border-color: var(--primary); }
.pill .c { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 650; }
.toolbar .count { margin-left: auto; font-size: 12px; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 9px 12px; background: var(--card-2); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { padding-left: 16px; } th:last-child, td:last-child { padding-right: 16px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--card-2); }
tr.sel td { background: var(--primary-soft) !important; }
.issue-title { font-weight: 600; color: var(--text); }
.mono { font: 11.5px var(--mono); color: var(--text-2); overflow-wrap: anywhere; }
.muted { color: var(--muted); }
td.num { white-space: nowrap; }
td.act { color: var(--muted); font-size: 12px; max-width: 360px; }
td.act .l { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.err { color: var(--bad) !important; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.empty .big { font-size: 15px; font-weight: 650; color: var(--text); margin-bottom: 4px; }
.empty .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--ok-bg); color: var(--ok); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
.empty .ic svg { width: 22px; height: 22px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 32, .38); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--card); z-index: 50; box-shadow: var(--shadow-lg); transform: translateX(102%); transition: transform .22s ease; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.d-head { padding: 18px 22px 0; border-bottom: 1px solid var(--line); }
.d-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.d-close { width: 32px; height: 32px; border-radius: 8px; justify-content: center; color: var(--muted); }
.d-close:hover { background: var(--card-2); color: var(--text); }
.d-head h2 { font-size: 18px; font-weight: 650; letter-spacing: -.01em; margin: 10px 0 6px; line-height: 1.35; }
.d-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 2px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 9px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }
.d-body { padding: 18px 22px 40px; overflow-y: auto; flex: 1; }
.d-body h4 { font-size: 11.5px; font-weight: 650; color: var(--muted); margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .05em; }
.d-body p { color: var(--text-2); white-space: pre-wrap; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0; }
.facts div { background: var(--card); padding: 10px 12px; min-width: 0; }
.facts dt { font-size: 11px; color: var(--muted); font-weight: 600; }
.facts dd { margin: 3px 0 0; font-size: 12.5px; color: var(--text); word-break: break-word; }
pre { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow: auto; font: 11.5px/1.6 var(--mono); margin: 0; max-height: 460px; color: var(--text-2); }
pre .add { color: var(--ok); } pre .del { color: var(--bad); } pre .hunk { color: var(--primary); } pre .dmeta { color: var(--muted); }
.file-label { font: 11.5px var(--mono); color: var(--muted); margin: 12px 0 6px; }
.ev-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.ev { border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
.ev .h { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-weight: 650; font-size: 12.5px; }
.ev .s { font: 11px var(--mono); color: var(--muted); margin-top: 4px; }
.ev pre { margin-top: 10px; max-height: 220px; white-space: pre-wrap; word-break: break-all; }
.callout { border-left: 3px solid var(--primary); background: var(--primary-soft); padding: 10px 12px; border-radius: 0 8px 8px 0; color: var(--text-2); font-size: 12.5px; }

.welcome { max-width: 560px; margin: 12vh auto 0; text-align: center; }
.welcome img { width: 60px; height: 60px; }
.welcome h1 { font-size: 24px; font-weight: 700; margin: 16px 0 6px; }
.welcome p { color: var(--muted); }
.welcome pre { text-align: left; margin-top: 18px; }

@media (max-width: 1080px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two { grid-template-columns: 1fr; } }
@media (max-width: 820px) {
  .shell { flex-direction: column; }
  .nav { width: 100%; flex: none; height: auto; position: static; }
  .nav-group.views { display: flex; gap: 4px; overflow-x: auto; padding: 10px; }
  .nav-group.views .nav-label { display: none; }
  .nav-group.views .nav-item { width: auto; white-space: nowrap; }
  .nav-item.active::before { display: none; }
  .runs { flex-direction: row; overflow-x: auto; }
  .run { min-width: 180px; }
  .nav-foot { display: none; }
  .topbar { position: static; flex-wrap: wrap; height: auto; padding: 10px 16px; }
  .search { width: 100%; order: 3; margin-left: 0; }
  .content { padding: 16px 16px 48px; }
  .pipeline { grid-template-columns: 1fr; }
  .stage { border-right: 0; border-bottom: 1px solid var(--line); }
  .stage:last-child { border-bottom: 0; }
  .ev-grid, .facts { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
  .d-head, .d-body { padding-left: 16px; padding-right: 16px; }
}
@media (max-width: 480px) { .kpis { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="shell">
  <aside class="nav">
    <div class="brand">
      <img src="/static/threadscan.svg" alt="" width="30" height="30">
      <div><b>Thread<span>scan</span></b><small>Verified vulnerability scans</small></div>
    </div>
    <div class="nav-group views" id="views"></div>
    <div class="nav-group">
      <div class="nav-label"><span>Scan runs</span><span id="run-count"></span></div>
      <div class="runs" id="runs"></div>
    </div>
    <div class="nav-foot">
      <span class="loc"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>Local · read-only</span>
      <button class="icon-btn" id="theme" type="button" aria-label="Toggle light or dark theme"></button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"><b>Threadscan</b></div>

/* helpers */

  const byMax = Math.max(1, ...Object.values(by));
  if (Object.keys(by).length) nodes.push(h("div", { class: "card", style: "margin-bottom:14px" }, h("div", { class: "card-h" }, h("h3", null, "Dropped by reason")),
    h("div", { class: "card-b" }, h("div", { class: "bars" }, Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, n]) => h("div", { class: "row", style: "grid-template-columns:170px minmax(0,1fr) 34px" },
      h("span", null, REASONS[k] || k), bar(100 * n / byMax, "var(--warn)"), h("span", { class: "num" }, n)))))));
  nodes.push(h("div", { class: "card" }, ver.length ? h("div", { class: "table-wrap", style: "margin-top:0" }, h("table", null,
    h("thead", null, h("tr", null, h("th", null, "Severity"), h("th", null, "Candidate"), h("th", null, "Component"), h("th", null, "Gate"), h("th", null, "Result"))),
    h("tbody", null, ver.map(v => h("tr", { class: v.state === "kept" ? "click" : "", onclick: v.state === "kept" ? () => openIssue(v.id) : null },
      h("td", null, v.severity ? sevBadge(v.severity) : "—"),
      h("td", null, h("div", { class: "issue-title" }, v.title), h("div", { class: "mono muted" }, v.id)),
      h("td", { class: "mono" }, v.component),
      h("td", null, stateChip(v.state)),
      h("td", { class: "act" }, v.reason ? (v.reason === "verified" ? "verified · patch " + (v.patch_check || "") : (REASONS[v.reason] || v.reason)) : ""))))))
    : h("div", { class: "empty" }, h("div", { class: "big" }, "No candidates yet"), "The gate runs after the agents finish.")));
  return nodes;
}

/* drawer */
function evidenceBox(label, ev, wantProof) {
  if (!ev) return h("div", { class: "ev" }, h("div", { class: "h" }, label, h("span", { class: "chip" }, "not run")));
  const good = wantProof ? ev.proof_line_seen && ev.exit_code === 0 : !ev.proof_line_seen && ev.exit_code === 0;
  return h("div", { class: "ev" }, h("div", { class: "h" }, label, h("span", { class: "chip " + (good ? "ok" : "warn") }, ev.proof_line_seen ? "proof printed" : "no proof")),
    h("div", { class: "s" }, "exit " + ev.exit_code + " · " + ev.duration_s + "s" + (ev.timed_out ? " · timed out" : "")),
    ev.stdout_tail ? h("pre", null, ev.stdout_tail) : null);
}
function openIssue(id) { selected = id; drawerTab = "overview"; renderDrawer(); render(); }
function closeIssue() { selected = null; renderDrawer(); render(); }
function renderDrawer() {
  const d = document.getElementById("drawer"), scrim = document.getElementById("scrim");
  const f = findings.find(x => x.id === selected);
  if (!f) { d.classList.remove("open"); scrim.classList.remove("open"); return; }
  const v = f.verification || {}, repro = f.reproducer || {};
  const tabs = [["overview", "Overview"], ["evidence", "Evidence"], ["reproducer", "Reproducer"], ["remediation", "Remediation"]];
  let body;
  if (drawerTab === "overview") body = [
    h("dl", { class: "facts" },
      [["Severity", sevBadge(f.severity)], ["Status", h("span", { class: "chip ok" }, "Verified · patch " + (v.patch_check || "—"))],
       ["Component", h("span", { class: "mono" }, f.component)], ["Location", h("span", { class: "mono" }, f.location)],
       ["CWE", f.cwe || "—"], ["Seeds", f.seed_ids && f.seed_ids.length ? f.seed_ids.join(", ") : "—"]].map(([k, val]) => h("div", null, h("dt", null, k), h("dd", null, val)))),
    h("h4", null, "Description"), h("p", null, f.description),
    h("h4", null, "Impact"), h("p", null, f.impact),
    h("h4", null, "Severity rationale"), h("p", null, f.severity_rationale || "—")];
  else if (drawerTab === "evidence") body = [
    h("div", { class: "callout", style: "margin-bottom:14px" }, "These are Threadscan's own runs in fresh, offline containers, not the agent's account."),
    h("div", { class: "ev-grid" }, evidenceBox("Unpatched code", v.unpatched_run, true), evidenceBox("With the patch", v.patched_run, false)),
    (v.notes || []).length ? [h("h4", null, "Notes"), (v.notes || []).map(n => h("p", null, n))] : null];
  else if (drawerTab === "reproducer") body = [h("h4", { style: "margin-top:0" }, "Script"), h("pre", null, repro.script || ""),
    (repro.files || []).map(rf => [h("div", { class: "file-label" }, rf.path), h("pre", null, rf.content)])];
  else body = [h("h4", { style: "margin-top:0" }, "Proposed patch"), f.patch ? diffPre(f.patch) : h("p", null, "—")];
  d.replaceChildren(
    h("div", { class: "d-head" },
      h("div", { class: "d-top" }, sevBadge(f.severity), h("button", { class: "d-close", type: "button", "aria-label": "Close", onclick: closeIssue }, icon("x"))),
      h("h2", null, f.title),
      h("div", { class: "d-meta" }, h("span", { class: "mono" }, f.id), h("span", { class: "mono" }, f.location)),
      h("div", { class: "tabs", role: "tablist" }, tabs.map(([k, l]) => h("button", { class: "tab", role: "tab", type: "button", "aria-selected": String(drawerTab === k), onclick: () => { drawerTab = k; renderDrawer(); } }, l)))),
    h("div", { class: "d-body" }, body));
  d.classList.add("open"); scrim.classList.add("open");
}
document.getElementById("scrim").addEventListener("click", closeIssue);
document.addEventListener("keydown", e => { if (e.key === "Escape" && selected) closeIssue(); });
document.getElementById("q").addEventListener("input", e => { query = e.target.value; if (view === "overview" && query) view = "issues"; render(); });

/* render */
function render() {
  renderViews(); renderRuns(); renderTop();
  const main = document.getElementById("main");
  if (!st) {
    main.replaceChildren(h("div", { class: "welcome" }, h("img", { src: "/static/threadscan.svg", alt: "" }), h("h1", null, "No scan runs yet"),
      h("p", null, "Start a scan and it appears here while it runs: build, one agent per component, the verification gate, and the issues that passed it."),
      h("pre", null, "threadscan scan targets/aegis --max-components 1 --dashboard")));
    return;
  }
  const nodes = view === "issues" ? issuesView() : view === "components" ? componentsView() : view === "gate" ? gateView() : overview();
  main.replaceChildren(...nodes.flat(Infinity).filter(Boolean));
}
async function refresh() {
  clearTimeout(timer);
  try {
    runs = await getJSON("/api/runs");
    if (!current && runs.length) current = runs[0].run_id;
    if (current) {
      st = await getJSON("/api/runs/" + encodeURIComponent(current));
      findings = await getJSON("/api/runs/" + encodeURIComponent(current) + "/findings");
    }
    render();
    if (selected) renderDrawer();
  } catch (e) { console.error(e); }
  timer = setTimeout(refresh, live() ? 2000 : 10000);
}
function select(id) {
  current = id; sevSel.clear(); selected = null; renderDrawer();
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  refresh();
}
if (location.hash.length > 1) current = decodeURIComponent(location.hash.slice(1));
refresh();
</script>
